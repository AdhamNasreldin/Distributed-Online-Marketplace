services:

  db-coordinator:
    image: mariadb:11
    container_name: db_coordinator
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_coordinator
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - coordinator_data:/var/lib/mysql
      - ./sql/coordinator-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-shard1:
    image: mariadb:11
    container_name: db_shard1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_shard1
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - shard1_data:/var/lib/mysql
      - ./sql/shard1-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-shard2:
    image: mariadb:11
    container_name: db_shard2
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_shard2
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3308:3306"
    volumes:
      - shard2_data:/var/lib/mysql
      - ./sql/shard2-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-analytics:
    image: mariadb:11
    container_name: db_analytics
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_analytics
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3309:3306"
    volumes:
      - analytics_data:/var/lib/mysql
      - ./sql/analytics-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db_network

networks:
  db_network:
    driver: bridge

volumes:
  coordinator_data:
  shard1_data:
  shard2_data:
  analytics_data: