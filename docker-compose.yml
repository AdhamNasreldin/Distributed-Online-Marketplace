services:
  db-coordinator:
    image: mariadb:11
    container_name: db_coordinator
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_coordinator
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - coordinator_data:/var/lib/mysql
      - ./Database/sql/coordinator-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./Database/sql/marketplace-coordinator.sql:/docker-entrypoint-initdb.d/02-marketplace.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-shard1:
    image: mariadb:11
    container_name: db_shard1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_shard1
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - shard1_data:/var/lib/mysql
      - ./Database/sql/shard1-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./Database/sql/marketplace-shard1.sql:/docker-entrypoint-initdb.d/02-marketplace.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-shard2:
    image: mariadb:11
    container_name: db_shard2
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_shard2
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3308:3306"
    volumes:
      - shard2_data:/var/lib/mysql
      - ./Database/sql/shard2-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./Database/sql/marketplace-shard2.sql:/docker-entrypoint-initdb.d/02-marketplace.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-analytics:
    image: mariadb:11
    container_name: db_analytics
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: marketplace_analytics
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3309:3306"
    volumes:
      - analytics_data:/var/lib/mysql
      - ./Database/sql/analytics-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  db-service:
    build: ./db-service
    container_name: marketplace_db_service
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      COORDINATOR_DB_URL: jdbc:mariadb://db-coordinator:3306/marketplace_coordinator
      COORDINATOR_DB_USER: appuser
      COORDINATOR_DB_PASS: apppass
      SHARD1_DB_URL: jdbc:mariadb://db-shard1:3306/marketplace_shard1
      SHARD1_DB_USER: appuser
      SHARD1_DB_PASS: apppass
      SHARD2_DB_URL: jdbc:mariadb://db-shard2:3306/marketplace_shard2
      SHARD2_DB_USER: appuser
      SHARD2_DB_PASS: apppass
    depends_on:
      db-coordinator:
        condition: service_healthy
      db-shard1:
        condition: service_healthy
      db-shard2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: marketplace_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DB_SERVICE_HOST: db-service
      DB_SERVICE_PORT: 5000
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      DEMO_2FA_CODE: 246810
    depends_on:
      db-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: marketplace_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  coordinator_data:
  shard1_data:
  shard2_data:
  analytics_data:
